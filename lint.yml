# Azure Pipeline for AL Code Linting
trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    include:
      - 'src/**/*.al'  # Adjust path to your AL files location
    exclude:
      - '*.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'src/**/*.al'  # Adjust path to your AL files location

pool:
  vmImage: 'windows-latest'  # PowerShell script requires Windows

variables:
  - name: 'ALFilesPath'
    value: 'src'  # Adjust to your AL files directory

stages:
  - stage: CodeQuality
    displayName: 'Code Quality Checks'
    jobs:
      - job: ALLinting
        displayName: 'AL Code Linting'
        steps:
          - checkout: self
            fetchDepth: 1
            
          - task: PowerShell@2
            displayName: 'Lint AL Code Files'
            inputs:
              targetType: 'inline'
              script: |
                # Get all AL files in the specified directory
                $alFiles = Get-ChildItem -Path "$(Build.SourcesDirectory)/$(ALFilesPath)" -Filter "*.al" -Recurse
                
                if ($alFiles.Count -eq 0) {
                    Write-Host "No AL files found in $(ALFilesPath)"
                    exit 0
                }
                
                Write-Host "Found $($alFiles.Count) AL files to lint"
                
                $hasErrors = $false
                $totalIssues = 0
                
                foreach ($file in $alFiles) {
                    Write-Host ""
                    Write-Host "🔍 Linting: $($file.FullName.Replace("$(Build.SourcesDirectory)\", ""))"
                    Write-Host "----------------------------------------"
                    
                    # Run the linting script
                    $output = & "$(Build.SourcesDirectory)/scripts/Lint-ALCode-WithLineNumbers.ps1" -FilePath $file.FullName
                    
                    if ($output) {
                        $issues = ($output | Measure-Object).Count
                        $totalIssues += $issues
                        
                        # Check if there are any errors (❌)
                        $errors = $output | Where-Object { $_ -match "❌" }
                        if ($errors) {
                            $hasErrors = $true
                        }
                        
                        Write-Host $output -ForegroundColor Yellow
                        Write-Host "Found $issues issues in this file" -ForegroundColor Cyan
                    } else {
                        Write-Host "✅ No issues found" -ForegroundColor Green
                    }
                }
                
                Write-Host ""
                Write-Host "========================================" -ForegroundColor Cyan
                Write-Host "LINTING SUMMARY" -ForegroundColor Cyan
                Write-Host "========================================" -ForegroundColor Cyan
                Write-Host "Total files checked: $($alFiles.Count)" -ForegroundColor Cyan
                Write-Host "Total issues found: $totalIssues" -ForegroundColor Cyan
                
                if ($hasErrors) {
                    Write-Host "❌ Build failed due to linting errors" -ForegroundColor Red
                    exit 1
                } elseif ($totalIssues -gt 0) {
                    Write-Host "⚠️ Build passed with warnings" -ForegroundColor Yellow
                    exit 0
                } else {
                    Write-Host "✅ All files passed linting" -ForegroundColor Green
                    exit 0
                }
            continueOnError: false
            
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Linting Results'
            condition: always()
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)'
              artifactName: 'linting-results'

          - task: SendEmail@1
            condition: failed()
            inputs:
              to: 'manish.kutar@winspiresolutions.com'
              subject: 'AL Code Linting Failed'
              body: 'The AL code linting pipeline has failed. Please check the build logs.'